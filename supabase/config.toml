# Local Supabase settings. Validate against the installed CLI before use.
project_id = "builder-collaboration-workspace"

[api]
enabled = true
# Ports moved off the defaults so this stack can run next to other local Supabase projects.
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
port = 55422
shadow_port = 55420

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 55423

[local_smtp]
port = 55424

[analytics]
port = 55427

# Handlers verify user JWTs with auth.getUser; adapters use scoped device tokens.
# Platform JWT verification cannot authenticate device tokens or public pairing.
[functions.teams]
verify_jwt = false
[functions.devices]
verify_jwt = false
[functions.sharing]
verify_jwt = false
[functions.ingest]
verify_jwt = false
[functions.overlap-check]
verify_jwt = false
