name: Checks

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Workspace and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm 10.9.8
        run: npm install --global npm@10.9.8

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run workspace checks
        run: npm run check

      - name: Run desktop and mobile browser checks
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
